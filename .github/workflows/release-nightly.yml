name: Release Nightly

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release-nightly:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Unit Tests
        run: cargo test --release

      - name: Resolve Release Version Metadata
        id: version_meta
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/resolve_version.py --channel nightly --run-number ${{ github.run_number }}

      - name: Build Release Binaries
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version_meta.outputs.commit_epoch }}
          ASLC_RELEASE_TAG: ${{ steps.version_meta.outputs.tag_name }}
        run: cargo build --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version_meta.outputs.version_name }}" installer\aslc-node.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare Nightly Assets
        id: prepare_assets
        shell: bash
        run: |
          set -euo pipefail
          SRC="installer/output/ASLC-Node-Setup-${{ steps.version_meta.outputs.version_name }}.exe"
          TARGET="${{ steps.version_meta.outputs.installer_name }}"
          test -f "$SRC"
          cp "$SRC" "$TARGET"
          sha256sum "$TARGET" | awk '{print $1}' > "$TARGET.sha256"
          echo "checksum=$(cat "$TARGET.sha256")" >> "$GITHUB_OUTPUT"

      - name: Publish Nightly GitHub Prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_meta.outputs.tag_name }}
          name: ${{ steps.version_meta.outputs.release_title }}
          body: |
            ### Automated Nightly Build: `${{ steps.version_meta.outputs.tag_name }}`

            This is an automated development prerelease built from the `main` branch.

            - **Version:** `${{ steps.version_meta.outputs.version_name }}`
            - **Build:** `${{ steps.version_meta.outputs.version_code }}`
            - **Commit:** `${{ steps.version_meta.outputs.commit_sha }}`
            - **Build Date:** `${{ steps.version_meta.outputs.build_date }}`
            - **Channel:** `Nightly`
            - **SHA-256 Checksum:** `${{ steps.prepare_assets.outputs.checksum }}`

            The desktop app can install this in place from **Check for updates**.

            <!-- metadata: channel=nightly commit=${{ steps.version_meta.outputs.commit_sha }} versionCode=${{ steps.version_meta.outputs.version_code }} versionName=${{ steps.version_meta.outputs.version_name }} -->
          files: |
            ${{ steps.version_meta.outputs.installer_name }}
            ${{ steps.version_meta.outputs.sha_name }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
