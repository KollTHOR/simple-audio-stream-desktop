[package]
name = "aslc_node"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "ASLC desktop node: USB (AOA) PCM source for the Simple Audio Stream Android receiver. Windows + Linux core."
license = "MIT"

# M0 is deliberately dependency-free (std only) so the protocol/framing core
# builds and tests offline on any host. The USB (nusb) and audio (cpal) crates
# are added at M1/M2 and will be target-gated.

[[bin]]
name = "aslc_node"
path = "src/bin/aslc_node.rs"

[[bin]]
name = "aslc_app"
path = "src/bin/aslc_app.rs"

[[bin]]
name = "aslc_driver"
path = "src/bin/aslc_driver.rs"

[lib]
name = "aslc"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "thin"

[dependencies]
futures-lite = "2"
nusb = "0.1.14"

# Desktop control window (GUI). Glow/OpenGL renderer + bundled fonts; no wgpu/wayland/x11.
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
# System-tray icon so closing the window minimizes instead of quitting.
tray-icon = "0.24"
# To grab the window handle for raw ShowWindow (tray restore runs off the UI thread).
raw-window-handle = "0.6"

# WASAPI loopback capture for the desktop PCM source (Windows only).
[target.'cfg(windows)'.dependencies]
wasapi = "0.25"
# Read the device's MTP/WPD friendly name from the registry (USB descriptors are board strings).
winreg = "0.56"
